services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: austin_traffic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pipeline:
    build: .
    depends_on:
      - db
    environment:
      LOG_LEVEL: INFO
    volumes:
      - .:/app

volumes:
  postgres_data:
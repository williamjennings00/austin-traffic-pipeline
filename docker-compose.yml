services:
  db:
    image: postgres:16

    environment:
      POSTGRES_DB: austin_traffic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U postgres -d austin_traffic"
        ]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  pipeline:
    build: .

    depends_on:
      db:
        condition: service_healthy

    environment:
      DB_NAME: austin_traffic
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: 5432
      LOG_LEVEL: INFO

    volumes:
      - .:/app

volumes:
  postgres_data:
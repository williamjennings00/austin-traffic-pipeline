services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: austin_traffic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  pipeline:
    build: .
    depends_on:
      - db
    environment:
      DB_NAME: austin_traffic
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: 5432
      LOG_LEVEL: INFO
    volumes:
      - .:/app

volumes:
  postgres_data: